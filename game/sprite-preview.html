<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orrhéa — planche des figurines</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0b0920; color: #e9e2cf; font-family: Georgia, 'Times New Roman', serif; }
      header { padding: 18px 24px 8px; border-bottom: 1px solid #3a2f5e; }
      h1 { margin: 0; font-size: 22px; letter-spacing: 0.04em; color: #f1d58a; }
      h2 { margin: 28px 24px 10px; font-size: 17px; color: #f1d58a; font-weight: normal; letter-spacing: 0.05em; }
      p.note { margin: 4px 24px; font-size: 13px; color: #a99fc4; }
      .controls { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 13px; color: #bdb3d8; }
      select, button { background: #1d1840; color: #f0e6c8; border: 1px solid #4d4180; border-radius: 4px; padding: 3px 8px; font: inherit; }
      section { margin: 0 24px; }
      canvas { display: block; }
      #perf { font-family: ui-monospace, monospace; font-size: 12px; color: #9fe0c8; margin: 6px 24px; white-space: pre; }
    </style>
  </head>
  <body>
    <header>
      <h1>Orrhéa — Tactiques des Sphères · planche procédurale</h1>
      <div class="controls">
        <label>Animation <select id="anim"></select></label>
        <label><input type="checkbox" id="slow" /> ralenti ×0,25</label>
        <span id="clock"></span>
      </div>
    </header>
    <div id="perf"></div>
    <main id="root"></main>
    <script type="module" src="/src/render/spritePreview.ts"></script>
  </body>
</html>
